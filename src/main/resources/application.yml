spring:

  application:

    name: mail-service

  servlet:

    multipart:

      max-file-size: 10MB

      max-request-size: 25MB
      
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mailservice}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
       ddl-auto: validate
    show-sql: false
    properties:
       hibernate:
         format_sql: true
      
  mail:

    host: ${SMTP_SERVER:smtp.gmail.com}

    port: ${MAIL_PORT:587}

    username: ${MAIL_USERNAME}

    password: ${MAIL_PASSWORD}

    properties:

      mail:

        smtp:

          auth: true

          starttls:

            enable: true

            required: true

server:

  port: ${SERVER_PORT:8086}


logging:
  file:
    path: ./target/
    name: ${spring.application.name}
    level:
      com.julian: DEBUG
      org.springframework.boot: INFO
      org.springframework.web: INFO    
    
springdoc:

  api-docs:

    path: /v3/api-docs

  swagger-ui:

    path: /swagger-ui.html

    operations-sorter: method

    tags-sorter: alpha